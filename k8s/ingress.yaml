apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-rag-ingress
  namespace: loan-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # CPU answers can take a while
spec:
  ingressClassName: nginx
  rules:
    - host: loan-rag.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loan-rag-ui
                port:
                  name: http